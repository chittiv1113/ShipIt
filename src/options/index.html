<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShipIt Settings</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #fafafa; }
      code { background: #f1f1f1; padding: 2px 6px; border-radius: 6px; }
      input, select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 14px; }
      label { font-size: 12px; font-weight: 700; margin-bottom: 6px; display: block; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .card { background: white; border: 1px solid #e5e5e5; border-radius: 16px; padding: 16px; }
      .btn { padding: 10px 12px; border-radius: 12px; border: 1px solid #ddd; background: white; cursor: pointer; }
      .btn:hover { background: #f6f6f6; }
      .btn-primary { border-color: rgba(37,99,235,.25); }
      .btn-danger { border-color: rgba(220,38,38,.25); }
      .muted { opacity: .75; font-size: 12px; line-height: 1.4; }
      .status { font-size: 12px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
